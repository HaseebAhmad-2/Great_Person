<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art & House Plans</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Art & House Plans</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <section id="home">
        <h2>Welcome to the World of Creativity</h2>
        <p>Explore the finest art collections and innovative house plans tailored for dreamers and creators.</p>
    </section>
    <section id="gallery">
        <h2>Gallery</h2>
        <div class="grid">
            <img src="art1.jpg" alt="Art 1">
            <img src="art2.jpg" alt="Art 2">
            <img src="house1.jpg" alt="House Plan 1">
            <img src="house2.jpg" alt="House Plan 2">
        </div>
    </section>
    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            
            <button type="submit">Submit</button>
        </form>
    </section>
    <footer>
        <p>© 2024 Art & House Plans. All rights reserved.</p>
    </footer>
</body>
</html>
